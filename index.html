<style>
:root{
  --blue:#0077D4; --blue-d:#005BA3; --blue-l:#E6F1FB;
  --bg:#F3F6FA; --card:#FFFFFF; --text:#1A2433; --muted:#6B7788; --line:#E3E8EF;
  --ok:#1E9E5A; --bad:#D64545; --wa:#25D366;
  --shadow:0 6px 24px rgba(10,40,80,.08);
  --r:16px;
}
[data-theme="dark"]{
  --bg:#0E141C; --card:#18212D; --text:#E8EEF5; --muted:#93A1B3; --line:#263242; --blue-l:#13304D;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Inter','Hind Siliguri',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body.bn{font-family:'Hind Siliguri','Inter',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);border-color:transparent}
.hidden{display:none!important}

/* ---------- PROFILE ---------- */
.pf{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.cover{position:relative;height:190px;background:linear-gradient(135deg,var(--blue) 0%,var(--blue-d) 100%);overflow:hidden;border-radius:0 0 28px 28px}
.cover::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 85% 20%,rgba(255,255,255,.18) 0,transparent 40%),
  radial-gradient(circle at 10% 90%,rgba(255,255,255,.12) 0,transparent 35%)}
.cover .emb{position:absolute;left:20px;top:18px;display:flex;align-items:center;gap:10px;color:#fff}
.cover .emb img{height:34px}
.cover .emb b{font-size:13px;letter-spacing:.3px;line-height:1.25;font-weight:600}
.cover .emb small{display:block;font-weight:400;opacity:.85;font-size:11px}
.tg{position:absolute;right:14px;top:14px;display:flex;gap:6px}
.tg button{background:rgba(255,255,255,.18);color:#fff;border-radius:999px;height:32px;min-width:32px;padding:0 10px;font-size:12px;font-weight:600;backdrop-filter:blur(6px)}
.av-wrap{display:flex;justify-content:center;margin-top:-62px;position:relative}
.av{width:124px;height:124px;border-radius:50%;border:5px solid var(--card);background:var(--blue-l);box-shadow:var(--shadow);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:var(--blue)}
.av img{width:100%;height:100%;object-fit:cover}
.who{text-align:center;padding:14px 22px 6px}
.who h1{font-size:23px;font-weight:700;line-height:1.3}
.who .t{color:var(--blue);font-weight:600;margin-top:4px;font-size:15px}
.who .d{color:var(--muted);font-size:13.5px;margin-top:2px}
.who .bio{color:var(--muted);font-size:13.5px;margin-top:10px;line-height:1.6}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 18px 6px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.act i{width:54px;height:54px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.act:active i{transform:scale(.93)}
.act svg{width:24px;height:24px}
.save{margin:14px 18px 4px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--blue);color:#fff;border-radius:14px;height:54px;font-weight:600;font-size:16px;box-shadow:0 8px 20px rgba(0,119,212,.35);width:calc(100% - 36px)}
.save:active{transform:scale(.98)}
.save svg{width:22px;height:22px}
.box{background:var(--card);margin:14px 18px 0;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:38px;height:38px;border-radius:11px;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .ic svg{width:19px;height:19px}
.row .tx{min-width:0;flex:1}
.row .tx small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:1px}
.row .tx span{display:block;font-size:14.5px;font-weight:500;word-break:break-word}
.row .go{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 18px 0}
.ghost{background:var(--card);box-shadow:var(--shadow);border-radius:14px;height:50px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;color:var(--blue)}
.ghost svg{width:19px;height:19px}
.foot{text-align:center;margin-top:28px;color:var(--muted);font-size:11.5px}
.foot img{height:56px;margin-bottom:8px;border-radius:4px}
.off{max-width:420px;margin:80px auto;text-align:center;padding:30px}
.off .ic{width:80px;height:80px;border-radius:50%;background:var(--blue-l);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:var(--blue)}
.off h2{font-size:20px;margin-bottom:8px}
.off p{color:var(--muted);line-height:1.6}

/* ---------- MODAL ---------- */
.mb{position:fixed;inset:0;background:rgba(5,15,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fi .2s}
.md{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px 26px;max-height:92vh;overflow:auto;animation:su .25s}
@media(min-width:700px){.mb{align-items:center}.md{border-radius:20px}}
.md h3{font-size:18px;margin-bottom:4px}
.md .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.md label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px;font-weight:500}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(40px);opacity:0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;background:var(--blue);color:#fff}
.btn.sec{background:var(--blue-l);color:var(--blue)}
.btn.out{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.red{background:#FCE9E9;color:var(--bad)}
.btn.wa{background:var(--wa)}
.btn svg{width:17px;height:17px}
.mrow{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.mrow .btn{flex:1}
.qrbox{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:14px;margin:6px auto;width:max-content}
.qrbox img,.qrbox svg{width:220px;height:220px;display:block}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#16202C;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:su .2s}

/* ---------- ADMIN ---------- */
.ad{min-height:100vh}
.top{background:var(--blue);color:#fff;padding:0 22px;height:62px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
.top img{height:32px}
.top b{font-size:16px}
.top small{opacity:.8;font-size:12px;display:block;font-weight:400}
.top .sp{flex:1}
.top button{background:rgba(255,255,255,.16);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600}
.tabs{display:flex;gap:4px;padding:12px 22px 0;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:11px 16px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.wrap{max-width:1180px;margin:0 auto;padding:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.st{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.st small{color:var(--muted);font-size:12.5px}
.st b{display:block;font-size:28px;margin-top:4px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input{max-width:300px}
.bar .sp{flex:1}
.tbl{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.pp{display:flex;align-items:center;gap:11px}
.pp .a{width:40px;height:40px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0}
.pp .a img{width:100%;height:100%;object-fit:cover}
.pp small{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-block;white-space:nowrap;line-height:1.5;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.pill.on{background:#E3F6EC;color:var(--ok)}.pill.off{background:#FCE9E9;color:var(--bad)}
.ia{display:flex;gap:4px;flex-wrap:nowrap}
.ia button{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ia button:hover{background:var(--blue-l);color:var(--blue)}
.ia svg{width:17px;height:17px}
code{background:var(--blue-l);color:var(--blue);padding:2px 7px;border-radius:6px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
.panel h3{font-size:17px;margin-bottom:4px}
.panel p.m{color:var(--muted);font-size:13.5px;margin-bottom:12px;line-height:1.6}
.panel label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px;font-weight:500}
.steps{counter-reset:s;list-style:none}
.steps li{position:relative;padding:10px 0 10px 42px;line-height:1.6;font-size:14.5px;border-bottom:1px dashed var(--line)}
.steps li:last-child{border:0}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.login{max-width:380px;margin:12vh auto;background:var(--card);padding:32px 28px;border-radius:20px;box-shadow:var(--shadow);text-align:center}
.login img{height:90px;margin-bottom:14px}
.login h2{margin-bottom:4px}
.login p{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.login .btn{width:100%;margin-top:12px;height:46px}
.phw{display:flex;align-items:center;gap:14px}
.phw .a{width:72px;height:72px;border-radius:50%;background:var(--blue-l);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:700;font-size:24px}
.phw .a img{width:100%;height:100%;object-fit:cover}
.sw{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px}
.sw input{width:auto}

/* ---------- PRINT CARD ---------- */
.cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.pc{width:85.6mm;height:54mm;border-radius:3.2mm;overflow:hidden;position:relative;box-shadow:0 4px 18px rgba(0,0,0,.18);font-family:'Inter','Hind Siliguri',sans-serif;flex-shrink:0}
.pc.f{background:linear-gradient(135deg,#0077D4,#005BA3);color:#fff;padding:5mm}
.pc.f .e{display:flex;align-items:center;gap:2.5mm}
.pc.f .e img{height:9mm}
.pc.f .e span{font-size:2.5mm;line-height:1.3;opacity:.95}
.pc.f .n{position:absolute;left:5mm;bottom:9mm;font-size:4.4mm;font-weight:700}
.pc.f .ti{position:absolute;left:5mm;bottom:5mm;font-size:2.7mm;opacity:.9}
.pc.f .nfc{position:absolute;right:5mm;bottom:5mm;width:8mm;height:8mm;opacity:.9}
.pc.b{background:#fff;color:#1A2433;display:flex;align-items:center;gap:4mm;padding:5mm}
.pc.b .q{width:30mm;height:30mm;flex-shrink:0}
.pc.b .q img,.pc.b .q svg{width:100%;height:100%}
.pc.b .i{font-size:2.3mm;word-break:break-word;min-width:0;line-height:1.55;color:#445}
.pc.b .i b{display:block;color:#0077D4;font-size:3.2mm;margin-bottom:1.5mm}
.pc.b .stripe{position:absolute;left:0;right:0;bottom:0;height:2mm;background:#0077D4}


.ia .iab{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ia .iab:hover{background:var(--blue-l);color:var(--blue)}.ia .iab svg{width:17px;height:17px}
.pcv svg{width:320px;height:auto;display:block;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.pf{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.login input{margin-bottom:0}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;display:block}
 .pcv svg{width:85.6mm;height:54mm;box-shadow:none;margin-bottom:8mm}@page{margin:12mm}}

function logScan(id) {

}
function vcard(s) {
  const o = S(), ph = s.officePhone || o.phone;
  const e = v => String(v || '').replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
  const parts = s.nameEn.split(' '), last = parts.length > 1 ? parts.pop() : '';
  const v = ['BEGIN:VCARD', 'VERSION:3.0', `N:${e(last)};${e(parts.join(' '))};;;`, `FN:${e(s.nameEn)}`, `ORG:${e(o.officeNameEn)};${e(s.deptEn)}`, `TITLE:${e(s.titleEn)}`];
  if (s.phone) v.push(`TEL;TYPE=CELL:${digits(s.phone)}`);
  if (ph) v.push(`TEL;TYPE=WORK,VOICE:${digits(ph)}${s.ext ? ',' + s.ext : ''}`);
  if (s.email) v.push(`EMAIL;TYPE=INTERNET,WORK:${s.email}`);
  v.push(`ADR;TYPE=WORK:;;${e(o.addressEn)};;;;`);
  if (o.website) v.push(`URL:${o.website}`);
  v.push(`NOTE:${e('Digital card: ' + cardUrl(s))}`);
  if (s.photo && s.photo.startsWith('data:image/jpeg')) v.push('PHOTO;ENCODING=b;TYPE=JPEG:' + s.photo.split(',')[1]);
  v.push('END:VCARD');
  return v.join('\r\n');
}
function saveVcf() { const s = window._cur; download(s.nameEn.replace(/[^\w]+/g, '_') + '.vcf', vcard(s), 'text/vcard'); }
function shareP() { const s = window._cur, url = cardUrl(s); if (navigator.share) navigator.share({ title: L(s, 'name'), text: `${L(s, 'name')} — ${L(s, 'title')}`, url }).catch(() => {}); else copy(url); }
function showQR() { const s = window._cur, t = TX[lang]; modal(`<h3>${esc(L(s, 'name'))}</h3><p class="sub">${t.qrSub}</p><div class="qrbox">${qrSvg(cardUrl(s))}</div><div class="mrow"><button class="btn out" onclick="closeModal()">${t.cancel}</button></div>`); }
function exchange() {

function sendEx(via) {
  const s = window._cur, t = TX[lang], g = id => $('#' + id).value.trim();

function cardSvg(s, side) {
  const o = S(), X = v => esc(v || ''), W = 856, H = 540;
  if (side === 'front') return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="85.6mm" height="54mm" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="g${s.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0077D4"/><stop offset="1" stop-color="#005BA3"/></linearGradient></defs>
    <rect width="${W}" height="${H}" rx="32" fill="url(#g${s.id})"/><circle cx="760" cy="80" r="190" fill="#fff" opacity=".07"/>
    <image href="${EMBLEM}" xlink:href="${EMBLEM}" x="50" y="48" width="104" height="${Math.round(104 * EMB_RATIO)}"/>
    <text x="172" y="88" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">${X(o.officeNameEn)}</text>
    <text x="172" y="122" fill="#fff" opacity=".88" font-family="Arial,Helvetica,sans-serif" font-size="19">${X(o.tagline2)}</text>
    <text x="50" y="420" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700">${X(s.nameEn)}</text>
    <text x="50" y="466" fill="#fff" opacity=".92" font-family="Arial,Helvetica,sans-serif" font-size="25">${X(s.titleEn)}${s.deptEn ? ' · ' + X(s.deptEn) : ''}</text>
    <g transform="translate(730,400) scale(3.6)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M6 8.3a6 6 0 0 1 0 7.4M9.5 5.5a10 10 0 0 1 0 13M13 3a14 14 0 0 1 0 18"/></g></svg>`;
  const qr = qrSvg(cardUrl(s)).replace('<svg', '<svg x="50" y="110" width="300" height="300"');
  const lines = [s.phone, s.email, o.addressEn, (o.website || '').replace(/^https?:\/\//, '')].filter(Boolean);
  const wrap = (str, n) => { const w = String(str).split(' '), out = []; let cur = ''; w.forEach(x => { if ((cur + ' ' + x).trim().length > n) { out.push(cur.trim()); cur = x; } else cur += ' ' + x; }); if (cur.trim()) out.push(cur.trim()); return out; };
  let y = 190, tl = '';
  lines.forEach(l => wrap(l, 32).forEach(p => { tl += `<text x="390" y="${y}" fill="#334" font-family="Arial,Helvetica,sans-serif" font-size="21">${X(p)}</text>`; y += 31; }));
  return `<svg xmlns="http://www.w3.org/2000/svg" width="85.6mm" height="54mm" viewBox="0 0 ${W} ${H}">
    <rect width="${W}" height="${H}" rx="32" fill="#fff" stroke="#e3e8ef" stroke-width="2"/><rect y="${H - 22}" width="${W}" height="22" fill="#0077D4"/>
    ${qr}<text x="390" y="140" fill="#0077D4" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">Tap or Scan</text>${tl}</svg>`;
}

  <div class="panel" style="margin-top:18px"><h3>🔒 পাসওয়ার্ড বদলান</h3><p class="m">আপনার অ্যাডমিন অ্যাকাউন্টের পাসওয়ার্ড বদলাতে নিচের বোতাম চাপুন — ইমেইলে লিংক যাবে।</p><button class="btn sec" onclick="auth.sendPasswordResetEmail(ME.email).then(()=>toast('ইমেইলে লিংক পাঠানো হয়েছে'),fbErr)">পাসওয়ার্ড রিসেট ইমেইল পাঠান</button></div>`;
}
async function saveSet() {
  const o = {}; SET.forEach(([k]) => o[k] = $('#s_' + k).value.trim()); o.baseUrl = $('#s_baseUrl').value.trim(); o.showDirectory = $('#s_dir').checked;
  try { await fs.doc('settings/office').set(o, { merge: true }); toast('সেটিংস সেভ হয়েছে ✓'); } catch (e) { fbErr(e); }
}

/* ---- backup / csv ---- */
function aBackup() {
  $('#aw').innerHTML = `<div class="panel"><h3>💾 ব্যাকআপ</h3><p class="m">মাসে একবার ব্যাকআপ রেখে দিন। প্রয়োজনে রিস্টোর করতে পারবেন।</p>
    <div class="mrow"><button class="btn sec" onclick="backup()">${I.download} ব্যাকআপ ডাউনলোড (JSON)</button><button class="btn out" onclick="exportCsv()">${I.download} Excel/CSV</button>
    <label class="btn out" style="cursor:pointer">📂 ব্যাকআপ রিস্টোর<input type="file" accept=".json" class="hidden" onchange="restore(this)"></label></div></div>`;
}
function backup() { download('nfc_backup_' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({ settings: SETTINGS, staff: STAFF.map(s => { const c = Object.assign({}, s); delete c.updated; return c; }) }, null, 1), 'application/json'); }
function restore(inp) {
  const f = inp.files[0]; if (!f) return;
  f.text().then(t => { let d; try { d = JSON.parse(t); if (!Array.isArray(d.staff)) throw 0; } catch (e) { return toast('ফাইলটি সঠিক নয়'); }
    ask(`ব্যাকআপ থেকে ${d.staff.length} জন স্টাফ ও অফিস সেটিংস রিস্টোর করবেন? একই আইডির বর্তমান তথ্য বদলে যাবে।`, 'রিস্টোর', async () => {
      try { for (let i = 0; i < d.staff.length; i += 400) { const b = fs.batch(); d.staff.slice(i, i + 400).forEach(s => { const { id, ...body } = s; b.set(fs.doc('staff/' + id), body); }); await b.commit(); }
        if (d.settings) await fs.doc('settings/office').set(d.settings, { merge: true }); toast('রিস্টোর সম্পন্ন ✓'); } catch (e) { fbErr(e); } }); });
}
const CSV_COLS = ['id', 'nameEn', 'nameBn', 'titleEn', 'titleBn', 'deptEn', 'deptBn', 'phone', 'whatsapp', 'email', 'ext', 'linkedin', 'bioEn', 'bioBn', 'active'];
function exportCsv() {
  const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [CSV_COLS.join(','), ...STAFF.map(s => CSV_COLS.map(k => cell(k === 'active' ? (s.active ? 'yes' : 'no') : s[k])).join(','))];
  download('staff_list.csv', '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8');
}
function parseCsv(t) {
  const out = []; let row = [], f = '', qd = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (qd) { if (c === '"' && t[i + 1] === '"') { f += '"'; i++; } else if (c === '"') qd = false; else f += c; }
    else if (c === '"') qd = true; else if (c === ',') { row.push(f); f = ''; } else if (c === '\n') { row.push(f); out.push(row); row = []; f = ''; } else if (c !== '\r') f += c; }
  if (f || row.length) { row.push(f); out.push(row); } return out;
}
function importCsv(inp) {
  const f = inp.files[0]; if (!f) return;
  f.text().then(async t => {
    const rows = parseCsv(t.replace(/^﻿/, '')).filter(r => r.some(x => x.trim())); const h = rows.shift().map(x => x.trim());
    let add = 0, upd = 0; const b = fs.batch();
    rows.forEach(r => { const o = {}; h.forEach((k, i) => { if (CSV_COLS.includes(k)) o[k] = (r[i] || '').trim(); }); if (!o.nameEn) return;
      o.active = !/^(no|false|0|না)$/i.test(o.active || 'yes');
      const ex = o.id && STAFF.find(x => x.id === o.id); const id = o.id || rid(); delete o.id;
      if (ex) { b.set(fs.doc('staff/' + id), o, { merge: true }); upd++; } else { o.order = STAFF.length + add + 1; b.set(fs.doc('staff/' + id), o); add++; } });
    try { await b.commit(); toast(`${add} জন যোগ, ${upd} জন আপডেট হয়েছে`); } catch (e) { fbErr(e); }
    inp.value = '';
  });
}
function aGuide() {
  $('#aw').innerHTML = `
  <div class="panel"><h3>📱 NFC কার্ডে লিংক লেখার নিয়ম</h3><p class="m">এর জন্য NFC সুবিধাযুক্ত একটি অ্যান্ড্রয়েড ফোন লাগবে।</p>
    <ol class="steps">
      <li>ফোনের <b>Settings → Connections → NFC</b> চালু করুন।</li>
      <li>Play Store থেকে <b>NFC Tools</b> অ্যাপ ইনস্টল করুন (ফ্রি)।</li>
      <li>"স্টাফ তালিকা" থেকে লিংক বোতামে ক্লিক করে স্টাফের লিংক কপি করুন, এবং ফোনে পাঠান (WhatsApp/ইমেইলে নিজেকে)।</li>
      <li>NFC Tools অ্যাপে <b>Write → Add a record → URL/URI</b> নির্বাচন করে লিংকটি পেস্ট করুন → OK।</li>
      <li><b>Write</b> চাপুন এবং কার্ডটি ফোনের পেছনে ধরে রাখুন। "Write complete" দেখালে সম্পন্ন।</li>
      <li>কার্ডটি আবার ফোনে ছুঁইয়ে পরীক্ষা করুন — প্রোফাইল খুলবে। আইফোনেও একবার পরীক্ষা করুন।</li>
      <li>সব ঠিক থাকলে অ্যাপের <b>Other → Lock tag</b> দিয়ে কার্ড লক করুন। ⚠️ লক স্থায়ী, তাই আগে নিশ্চিত হয়ে নিন।</li>
    </ol></div>
  <div class="panel"><h3>🛒 কার্ড অর্ডার করার সময়</h3><ol class="steps">
    <li>চিপ: <b>NTAG215</b> বা <b>NTAG216</b>।</li>
    <li>কার্ড বোতাম থেকে প্রতিটি স্টাফের সামনে-পেছনের SVG ডিজাইন ডাউনলোড করে প্রিন্টিং প্রতিষ্ঠানকে দিন।</li>
    <li>কার্ড খালি (blank chip) অবস্থায় নিন — লিংক আপনি নিজে লিখবেন।</li>
  </ol></div>`;
}

/* ================= ROUTER ================= */
function route(soft) {
  if (!soft) closeModal();
  if (!CONFIGURED) return renderSetup();
  const h = location.hash || '#/'; const m = h.match(/^#\/c\/([\w-]+)/);
  if (m) renderProfile(m[1], soft); else if (h.startsWith('#/admin')) { if (ME) startAdminData(); renderAdmin(); } else renderHome(soft);
}
let ME_INIT = false;
if (CONFIGURED) {
  ME = undefined;
  auth.onAuthStateChanged(u => { ME = u || null; if (!ME) stopAdminData(); else if (isAdminRoute()) startAdminData(); if (isAdminRoute() || !ME_INIT) { ME_INIT = true; if (isAdminRoute()) renderAdmin(); } });
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
route();

</script>
